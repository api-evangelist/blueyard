name: BlueYard
description: 'BlueYard Capital is a venture capital firm founded in 2016, operating as a small, equal
  partnership with offices in Europe and the United States. Managing roughly $500M in AUM, it invests
  $500K-$5M at pre-seed to Series A as lead or co-lead investor, backing two kinds of technologies:
  those that move us toward utopia and those that hold the line against oblivion. Its focus areas span
  computation & intelligence, engineering/aerospace & defense, biology & chemistry, and crypto. Notable
  portfolio companies and exits include Privy (acquired by Stripe), Groq, IonQ, Filecoin, Castelion,
  and Marvel Fusion. This profile was surfaced as a portfolio relationship of foundry-group and enriched
  from BlueYard''s public website; it exposes no public developer API.'
